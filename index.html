<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub | Fashion Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            color: #222;
        }

        /* Navbar */
        header {
            background: white;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 2px 8px #ddd;
            flex-wrap: wrap;
        }

        .logo {
            color: #ff3f6c;
            font-size: 27px;
            font-weight: bold;
        }

        .search {
            padding: 12px;
            width: 35%;
            min-width: 180px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .cart {
            font-weight: bold;
            cursor: pointer;
        }

        /* Categories */
        .categories {
            background: white;
            padding: 18px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .categories button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .categories button:hover {
            color: #ff3f6c;
        }

        /* Hero Section */
        .hero {
            margin: 25px auto;
            width: 92%;
            padding: 55px 25px;
            border-radius: 12px;
            text-align: center;
            background: linear-gradient(120deg, #ffe0e8, #e7dfff);
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 17px;
            margin-bottom: 20px;
        }

        .shop-btn {
            background: #ff3f6c;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Products */
        .section-title {
            text-align: center;
            margin: 35px 0 25px;
            font-size: 28px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
            padding: 0 5% 40px;
        }

        .product {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px #ddd;
            transition: transform 0.2s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            background: #eee;
        }

        .product-info {
            padding: 15px;
        }

        .product h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .old-price {
            color: #888;
            text-decoration: line-through;
            font-size: 13px;
            margin-left: 5px;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .actions button {
            flex: 1;
            padding: 9px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .add-cart {
            background: #ff3f6c;
            color: white;
        }

        .wishlist {
            background: #ffe5ec;
            color: #ff3f6c;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* Mobile Responsive */
        @media (max-width: 750px) {
            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
                padding: 0 12px 30px;
            }

            .product img {
                height: 180px;
            }

            .hero h1 {
                font-size: 27px;
            }

            .hero {
                padding: 40px 15px;
            }

            .search {
                width: 100%;
                order: 3;
            }

            header {
                gap: 12px;
            }
        }

        @media (max-width: 350px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header>
        <div class="logo">StyleHub ✨</div>

        <input
            type="text"
            class="search"
            id="search"
            placeholder="Search for clothes..."
            aria-label="Search products"
        >

        <div class="cart" id="cartCount">
            🛒 Cart (0)
        </div>
    </header>

    <!-- Categories -->
    <nav class="categories" aria-label="Product categories">
        <button onclick="filterProducts('All')">All</button>
        <button onclick="filterProducts('Men')">Men</button>
        <button onclick="filterProducts('Women')">Women</button>
        <button onclick="filterProducts('Accessories')">Accessories</button>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1>Discover Your Style 💖</h1>
        <p>Trendy fashion at prices you'll love!</p>
        <button class="shop-btn"
            onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
            Shop Now
        </button>
    </section>

    <!-- Product Section -->
    <h2 class="section-title">✨ Trending Collection</h2>

    <main class="products" id="products"></main>

    <!-- Footer -->
    <footer>
        <h3>StyleHub ✨</h3>
        <p style="margin-top:10px">
            Fashion for everyone | Made with ❤️
        </p>
        <p style="margin-top:10px">
            © 2026 StyleHub. All rights reserved.
        </p>
    </footer>

    <script>
        // Product details
        const products = [
            {
                id: 1,
                name: "Men's Casual T-Shirt",
                price: 499,
                oldPrice: 799,
                category: "Men",
                image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
            },
            {
                id: 2,
                name: "Women's Summer Dress",
                price: 899,
                oldPrice: 1299,
                category: "Women",
                image: "https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=500"
            },
            {
                id: 3,
                name: "Men's Denim Jacket",
                price: 1299,
                oldPrice: 1799,
                category: "Men",
                image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500"
            },
            {
                id: 4,
                name: "Women's Fashion Top",
                price: 599,
                oldPrice: 999,
                category: "Women",
                image: "https://images.unsplash.com/photo-1566206091558-7f218b696731?w=500"
            },
            {
                id: 5,
                name: "Classic Sunglasses",
                price: 399,
                oldPrice: 699,
                category: "Accessories",
                image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"
            },
            {
                id: 6,
                name: "Men's Sneakers",
                price: 1499,
                oldPrice: 1999,
                category: "Men",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
            },
            {
                id: 7,
                name: "Women's Handbag",
                price: 799,
                oldPrice: 1199,
                category: "Accessories",
                image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"
            },
            {
                id: 8,
                name: "Women's Casual Outfit",
                price: 999,
                oldPrice: 1499,
                category: "Women",
                image: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500"
            }
        ];

        // Shopping cart and wishlist
        let cart = [];
        let wishlist = [];

        // Display products
        function displayProducts(list) {
            const container = document.getElementById("products");

            if (list.length === 0) {
                container.innerHTML = "<p>No products found.</p>";
                return;
            }

            container.innerHTML = list.map(product => `
                <article class="product">
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        loading="lazy"
                    >

                    <div class="product-info">
                        <h3>${product.name}</h3>

                        <p class="price">
                            ₹${product.price}
                            <span class="old-price">
                                ₹${product.oldPrice}
                            </span>
                        </p>

                        <div class="actions">
                            <button
                                class="add-cart"
                                onclick="addToCart(${product.id})">
                                🛒 Add
                            </button>

                            <button
                                class="wishlist"
                                onclick="toggleWishlist(${product.id})">
                                ❤️ Wishlist
                            </button>
                        </div>
                    </div>
                </article>
            `).join("");
        }

        // Add products to cart
        function addToCart(id) {
            const product = products.find(item => item.id === id);
            cart.push(product);

            document.getElementById("cartCount").textContent =
                `🛒 Cart (${cart.length})`;

            alert(product.name + " added to cart!");
        }

        // Wishlist
        function toggleWishlist(id) {
            const product = products.find(item => item.id === id);

            if (wishlist.includes(id)) {
                wishlist = wishlist.filter(item => item !== id);
                alert(product.name + " removed from wishlist.");
            } else {
                wishlist.push(id);
                alert(product.name + " added to wishlist!");
            }
        }

        // Filter products by category
        function filterProducts(category) {
            const filtered = category === "All"
                ? products
                : products.filter(item => item.category === category);

            displayProducts(filtered);
        }

        // Search products
        document.getElementById("search").addEventListener("input", function() {
            const searchText = this.value.toLowerCase();

            const filtered = products.filter(item =>
                item.name.toLowerCase().includes(searchText) ||
                item.category.toLowerCase().includes(searchText)
            );

            displayProducts(filtered);
        });

        // Initial display
        displayProducts(products);
    </script>

</body>
</html>
